
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카페 관리자 주문 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="menu-container">
    <h1>카페 관리자</h1>

    <div id="login-area">
      <input id="admin-email" type="email" placeholder="관리자 이메일">
      <input id="admin-password" type="password" placeholder="비밀번호">
      <button id="login-button">로그인</button>
    </div>

    <p id="admin-message">관리자 로그인이 필요합니다.</p>
    <section id="orders-area"></section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
  <script src="admin.js"></script>
</body>
</html>
